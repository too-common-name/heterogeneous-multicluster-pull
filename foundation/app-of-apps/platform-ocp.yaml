apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: platform-ocp
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: platform
              operator: In
              values: ["ocp"]
            - key: name
              operator: NotIn
              values: ["local-cluster"]
