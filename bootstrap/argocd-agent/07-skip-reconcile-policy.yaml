apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: agent-cluster-skip-reconcile
  namespace: openshift-gitops
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: agent-cluster-skip-reconcile
        spec:
          remediationAction: enforce
          severity: low
          namespaceSelector:
            include:
              - openshift-gitops
          object-templates:
            - complianceType: musthave
              objectSelector:
                matchExpressions:
                  - key: argocd-agent.argoproj-labs.io/agent-name
                    operator: Exists
                  - key: argocd.argoproj.io/secret-type
                    operator: In
                    values: ["cluster"]
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  annotations:
                    argocd.argoproj.io/skip-reconcile: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: agent-cluster-skip-reconcile-binding
  namespace: openshift-gitops
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: local-cluster-only
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: agent-cluster-skip-reconcile
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: local-cluster-only
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: ["local-cluster"]
