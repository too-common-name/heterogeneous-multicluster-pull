# --- Mortgage team: admin on their gitops namespace ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mortgage-team-admin
  namespace: mortgage-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mortgage-team
---
# --- Insurance team: admin on their gitops namespace ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insurance-team-admin
  namespace: insurance-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: insurance-team
---
# --- Mortgage team: view on ManagedClusterSet "mortgage" ---
# "view" (not "admin") so ACM auto-propagates only ClusterRole/view
# into each cluster namespace. Teams can see their clusters via
# clusterview API but cannot create ManagedClusters or accept
# registrations — foundation-admin handles that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mortgage-team-mcs-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:managedclusterset:view:mortgage
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mortgage-team
---
# --- Insurance team: view on ManagedClusterSet "insurance" ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: insurance-team-mcs-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:managedclusterset:view:insurance
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: insurance-team
---
# --- Secret reader on cluster namespaces ---
# ACM's MCS "view" role auto-propagates ClusterRole/view into each
# cluster namespace, but "view" excludes secrets. We add a minimal
# Role that allows only get/list on secrets (needed for extracting
# the <cluster>-import secret during spoke onboarding).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: insolvency-check-sno
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mortgage-team-secret-reader
  namespace: insolvency-check-sno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mortgage-team
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: kind-local
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mortgage-team-secret-reader
  namespace: kind-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mortgage-team
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: parasol-sno
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insurance-team-secret-reader
  namespace: parasol-sno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: insurance-team
